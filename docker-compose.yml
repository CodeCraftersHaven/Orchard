services:
  db-push:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        NODE_ENV: production
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - db-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        NODE_ENV: production
        BASE_URL: ${BASE_URL}
        API_BASE_URL: ${API_BASE_URL}
        DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
    restart: always
    depends_on:
      db-push:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8989:8989"
    networks:
      - db-net

  dash:
    build:
      context: .
      dockerfile: Dockerfile
      target: dash
      args:
        NODE_ENV: production
        BASE_URL: ${BASE_URL}
        API_BASE_URL: ${API_BASE_URL}
        DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8990:8990"
    networks:
      - db-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
      args:
        NODE_ENV: production
        BASE_URL: ${BASE_URL}
        API_BASE_URL: ${API_BASE_URL}
        DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
    restart: always
    depends_on:
      db-push:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - db-net

networks:
  db-net:
    external: true
